services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cozema_auth
      POSTGRES_USER: cozema_auth
      # This password is intentionally local-only. The database listens only
      # on loopback and must never be reused outside development.
      POSTGRES_PASSWORD: local-password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - cozema-auth-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cozema_auth -d cozema_auth"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  cozema-auth-dev-postgres:
